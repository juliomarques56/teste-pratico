name: Testes

on:
  push:
    branches:
      - challenge-qa
  pull_request:
    branches:
      - challenge-qa

jobs:
  run-tests:
    runs-on: ubuntu-latest
    container:
        image: cypress/included:cypress-13.15.1-node-22.11.0-chrome-130.0.6723.69-1-ff-132.0-edge-130.0.2849.56-1
    steps:
      - name: Checando código
        uses: actions/checkout@v2

      - name: Configurando Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Instalando dependências
        run: |
          npm install
          npm run prepare

      - name: Executando testes
        run: npm run test
